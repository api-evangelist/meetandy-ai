aid: meetandy-ai
name: MeetAndy AI
description: >-
  MeetAndy (operated by MeetTomorrow Inc.) is an AI project assistant — an "AI
  teammate" that lives in Slack, Google Chat, GitHub, GitLab, and Jira and turns
  plain-language requests into reviewable plans, opens pull requests, runs CI,
  and reports back. Its Coding Agent writes the code Andy plans and hands off
  work to human review, while Team Memory preserves architectural decisions and
  conventions as searchable context. MeetAndy exposes an agent-native surface
  rather than a public REST API: a hosted MCP server (hub.meetandy.ai) for
  external tools like Claude Code to read tasks and Spaces, a published llms.txt,
  and public Claude Code Agent Skills. Founded 2024; backed by 500 Global and
  NVIDIA Inception.
